<!doctype html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loppet</title>
</head>

<body>

  <header>
    <h1>Loppet</h1>
    <nav>
      <ul id="menu">
        <li><a href="/" class="nav-link">Startsida</a></li>
        <li><a href="/add" class="nav-link">Lägg till lopp</a></li>
        <li><a href="/login" class="nav-link">Logga in</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="page-section">
      <h2>Skapa konto</h2>
      <p>Skapa ett konto för att lägg till och tipsa om lopp.</p>
      <p>Har du redan ett konto? <a href="login"> Logga in här</a> </p>

      <span id="message" class="message"></span>

      <form id="register-form" method="POST">
        <label for="username">Användarnamn</label>
        <span id="username-error" class="error"></span>
        <input type="text" id="username" name="username">

        <label for="email">E-post</label>
        <span id="email-error" class="error"></span>
        <input type="email" id="email" name="email">

        <label for="password">Lösenord</label>
        <span id="password-error" class="error"></span>
        <input type="password" id="password" name="password">

        <button type="submit" class="button">Skapa konto</button>



      </form>
    </section>

  </main>
  <footer>
    <p><strong>Av: </strong> Rasmus Bergkvist, 2026</p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
